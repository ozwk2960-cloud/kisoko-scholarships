name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest（fixture ベースのオフラインテスト）
        run: python -m pytest -q
      - name: スキーマ検証（コミット済み scholarships.json）
        run: |
          python - <<'PY'
          import json, jsonschema
          data = json.load(open("public/scholarships.json", encoding="utf-8"))
          schema = json.load(open("scraper/schema.json", encoding="utf-8"))
          jsonschema.validate(data, schema)
          print("scholarships.json: スキーマOK")
          PY
