name: scrape

# 毎日 JST 06:00（UTC 21:00）に自動実行。手動実行も可。
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

# 同時実行を1本に制限（前の実行が長引いても衝突しない）
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python -m scraper.run

      - name: Commit updated data (skip if only timestamps changed)
        run: |
          set -euo pipefail
          if git diff --quiet -- public/scholarships.json public/deadlines.ics; then
            echo "変更なし。コミットしません。"
            exit 0
          fi

          # generated_at / fetched_at だけの差分ならコミットしない（履歴を汚さない）
          substantive="$(git diff -U0 -- public/scholarships.json public/deadlines.ics \
            | grep -E '^[+-]' \
            | grep -vE '^[+-]{3} ' \
            | grep -vE '"(generated_at|fetched_at)":' \
            || true)"

          if [ -z "$substantive" ]; then
            echo "タイムスタンプのみの変更。コミットをスキップします。"
            git checkout -- public/scholarships.json public/deadlines.ics
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scholarships.json public/deadlines.ics
          git commit -m "data: 奨学金情報を更新 ($(date -u +%Y-%m-%d)) [skip ci]"
          git push
