name: scrape

# 毎日 JST 06:00（UTC 21:00）に自動実行。手動実行も可。
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

# 同時実行を1本に制限（前の実行が長引いても衝突しない）
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python -m scraper.run

      - name: Commit updated data (skip if only timestamps changed)
        run: |
          set -euo pipefail
          if git diff --quiet -- public/scholarships.json public/deadlines.ics; then
            echo "変更なし。コミットしません。"
            exit 0
          fi

          # generated_at / fetched_at だけの差分ならコミットしない（履歴を汚さない）
          substantive="$(git diff -U0 -- public/scholarships.json public/deadlines.ics \
            | grep -E '^[+-]' \
            | grep -vE '^[+-]{3} ' \
            | grep -vE '"(generated_at|fetched_at)":' \
            || true)"

          if [ -z "$substantive" ]; then
            echo "タイムスタンプのみの変更。コミットをスキップします。"
            git checkout -- public/scholarships.json public/deadlines.ics
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scholarships.json public/deadlines.ics
          # [skip ci] は付けない: Cloudflare Pages も [skip ci] でデプロイを止めてしまい、
          # 更新がサイトに反映されなくなる。ci(pytest) 側は paths-ignore で除外済み。
          git commit -m "data: 奨学金情報を更新 ($(date -u +%Y-%m-%d))"
          git push

      - name: Keepalive（schedule が60日無活動で自動停止するのを防ぐ）
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          # 毎月1日だけ、空コミットを1つ入れてリポジトリ活動を記録する。
          # 最大でも約30日ごとに活動があるため 60日ルールに到達しない。
          [ "$(date -u +%d)" = "01" ] || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 空コミットは配信物に影響しないので Cloudflare のビルドは省略してよい
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m) [skip ci]"
          git push
